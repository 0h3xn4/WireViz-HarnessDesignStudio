name: harness-design-studio CI

on:
  push:
    branches: [master]  # branches are tested through their pull request; running both doubled every push
    paths: ["HarnessDesignStudio/**", ".github/workflows/harness-ci.yml"]
  pull_request:
    paths: ["HarnessDesignStudio/**", ".github/workflows/harness-ci.yml"]

permissions:
  contents: read  # the jobs only read the repository; artifacts need no token rights

# A newer push to the same branch replaces the run in progress or waiting, so pushes in quick
# succession do not pile up and keep the shared runners busy for hours. A push to master is never
# cancelled: the release steps want a green run on every merge commit.
concurrency:
  group: harness-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: HarnessDesignStudio

jobs:
  changes:
    # Documents only (Markdown under HarnessDesignStudio/ and all of its compliance/ folder): the full
    # suite and the platform jobs are skipped and the `docs` job below runs the checks that read
    # documents. Anything else, or any doubt, runs everything (docs/DECISIONS.md D-138).
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          code=true
          if files=$(git diff --name-only "$BASE...$HEAD" 2>/dev/null) && [ -n "$files" ]; then
            if ! echo "$files" | grep -v -E '^HarnessDesignStudio/[^/]+\.md$|^HarnessDesignStudio/docs/.*\.md$|^HarnessDesignStudio/compliance/' | grep -q .; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "changed files:"; echo "$files"; echo "full run needed: $code"

  docs:
    # The checks that read documents; the full suite in `test` includes them too.
    needs: changes
    if: needs.changes.outputs.code == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0
      - run: python -m pip install -e ".[gui,dev]"
      - run: >
          pytest -q tests/test_docs.py tests/test_docs_links.py tests/test_compliance_matrix.py
          tests/test_scf.py tests/test_sdd_components.py tests/test_trace.py tests/test_metrics.py
          tests/test_family_group_mapping.py tests/test_profiles.py
          tests/test_drc.py::test_cited_requirements_exist_in_the_extracted_lists
          tests/test_examples.py::test_the_flatsat_walkthrough_matches_the_example

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 24.04 and newer only (docs/DECISIONS.md D-127). The `package-on-24-04` job then
        # installs the packages on a fresh runner that has no source checkout.
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150  # about 1 hour is expected on 4 cores (the serial run took 1h38 to 2h57); the limit also covers 2 cores and still stops a hung test
    env:
      HARNESS_TIME_FACTOR: "3"  # shared runners are slower than a workstation; limits in tests scale by this
      HARNESS_REQUIRE_BROWSER: "1"  # the clickable prototype tests must run, not skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 poppler-utils
      - run: python -m pip install -e ".[gui,dev]"
      - name: Chromium for the prototype tests
        run: python -m playwright install --with-deps chromium
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      # The suite runs on all the runner's cores (pytest-xdist, docs/DECISIONS.md D-148). Tests that
      # assert a wall-clock limit (marker `perf`) would fail on a loaded machine, so they run alone,
      # after the parallel run; the two selections together are the whole suite. The first step
      # collects coverage without judging it, the second adds its own and applies the 90% gate on core.
      - name: Tests in parallel (all but the timing tests)
        run: pytest -n auto --dist worksteal -m "not perf" --cov --cov-report= --cov-fail-under=0
      - name: Timing tests, one at a time
        run: pytest -m perf --cov --cov-append --cov-report=term-missing
      - run: python -m tools.check_reproducible
      - run: python -m tools.build_installer
      - run: python -m tools.build_deb
      - name: Frozen app self-test
        run: dist/harness-design-studio/harness-design-studio-gui --selftest
      - run: python -m tools.gen_sbom
      - name: Both packages exist
        run: ls dist/*.deb dist/*.tar.gz  # the upload below only fails when none of its files exist
      - uses: actions/upload-artifact@v4
        with:
          name: harness-design-studio-${{ matrix.os }}
          if-no-files-found: error
          path: |
            HarnessDesignStudio/dist/*.deb
            HarnessDesignStudio/dist/*.tar.gz
            HarnessDesignStudio/dist/release-docs/*

  package-on-24-04:
    # Prove that the packages work on a fresh machine without the source tree.
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ github.workspace }}  # this job has no checkout, so there is no HarnessDesignStudio/ folder
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: harness-design-studio-ubuntu-24.04
          path: pkg
      - name: Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0
      - name: Run the tarball built in the test job
        working-directory: pkg
        run: |
          ls -R .
          tar xzf harness-design-studio-*-linux-*.tar.gz
          QT_QPA_PLATFORM=offscreen ./harness-design-studio/harness-design-studio-gui --selftest
          HOME="$PWD/home" ./harness-design-studio/install.sh
          HOME="$PWD/home" "$PWD/home/.local/bin/harness-design-studio" --version
          HOME="$PWD/home" "$PWD/home/.local/bin/harness" --version
          HOME="$PWD/home" ./harness-design-studio/uninstall.sh
      - name: Install and run the .deb built in the test job
        working-directory: pkg
        run: |
          sudo apt-get install -y ./harness-design-studio_*_amd64.deb
          harness-design-studio --version
          harness --version
          QT_QPA_PLATFORM=offscreen harness-design-studio-gui --selftest
          test -f /usr/share/doc/harness-design-studio/copyright
          sudo apt-get remove -y harness-design-studio
          ! test -e /opt/harness-design-studio
