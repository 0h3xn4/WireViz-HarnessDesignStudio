name: harness-design-studio release

# Pushing an annotated tag vX.Y.Z builds the packages (Linux and Windows) and publishes the GitHub
# release page (docs/RELEASE.md step 15). `workflow_dispatch` with the tag name runs it again for an existing tag: the files and the notes of an existing release
# page are replaced. The build jobs only read the repository and hand their packages on as
# artifacts; one final job, `release`, writes the checksums of all of them and publishes.
#
# Signing is optional and happens only when these repository secrets exist (docs/RELEASE.md):
#   Windows: WINDOWS_CERT_PFX_BASE64 (the .pfx certificate, base64), WINDOWS_CERT_PASSWORD
# Without them the packages are built unsigned.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and publish, for example v1.2.0"
        required: true
        type: string
      notes_only:
        description: "Only write the release page text again (from the tag's changelog and the published SHA256SUMS); build and upload nothing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read  # only the release job below may write

concurrency:
  group: harness-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false  # never stop a release half way

defaults:
  run:
    working-directory: HarnessDesignStudio

jobs:
  linux:
    if: ${{ !inputs.notes_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag matches the version and the changelog
        run: python -m tools.release_notes check "$TAG"
      - name: Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0
      - run: python -m pip install -e ".[gui,dev]"
      - run: python -m tools.build_installer
      - run: python -m tools.build_deb
      - name: Frozen app self-test
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: dist/harness-design-studio/harness-design-studio-gui --selftest
      - name: Install the .deb and run it
        timeout-minutes: 5  # without it a stuck program holds the job for the 60 minutes below
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONFAULTHANDLER: "1"  # SIGABRT makes a stuck program print where each thread is
        run: |
          sudo apt-get install -y ./dist/harness-design-studio_*_amd64.deb
          # Full paths: the pip install above puts commands of the same names (the source
          # install, whose editor does not know the self-test flag) in front of /usr/bin on the PATH
          for cmd in harness harness-design-studio harness-design-studio-gui; do
            case "$(readlink -f "/usr/bin/$cmd")" in
              /opt/harness-design-studio/*) ;;
              *) echo "::error::/usr/bin/$cmd is not the installed program"; exit 1 ;;
            esac
          done
          test "$(/usr/bin/harness --version)" = "harness ${TAG#v}"
          descendants() { for c in $(pgrep -P "$1"); do echo "$c"; descendants "$c"; done; }
          /usr/bin/harness-design-studio-gui --selftest &
          pid=$!
          for _ in $(seq 120); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          if kill -0 "$pid" 2>/dev/null; then
            echo "::error::the self-test of the installed program did not finish in 120 s"
            ps -eo pid,ppid,etime,stat,args --forest
            for c in $(descendants "$pid") "$pid"; do kill -ABRT "$c" 2>/dev/null || true; done
            sleep 5
            exit 1
          fi
          wait "$pid"
          test -f /usr/share/doc/harness-design-studio/copyright
      - uses: actions/upload-artifact@v4
        with:
          name: packages-linux
          if-no-files-found: error
          path: |
            HarnessDesignStudio/dist/*.deb
            HarnessDesignStudio/dist/*.tar.gz

  windows:
    if: ${{ !inputs.notes_only }}
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      PYTHONUTF8: "1"
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[gui,dev]"
      - name: Inno Setup (preinstalled on the runner image; installed when it is not)
        run: |
          $found = (Get-Command ISCC -ErrorAction SilentlyContinue) -or (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") -or (Test-Path "${env:LOCALAPPDATA}\Programs\Inno Setup 6\ISCC.exe")
          if (-not $found) { choco install innosetup --version=6.4.3 -y --no-progress }
          else { Write-Host "Inno Setup is already installed" }
      - name: Signing certificate (only when the secret exists)
        if: ${{ env.WINDOWS_CERT_PFX_BASE64 != '' }}
        run: |
          $path = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          "HARNESS_SIGN_PFX=$path" >> $env:GITHUB_ENV
          "HARNESS_SIGN_PASSWORD=$env:WINDOWS_CERT_PASSWORD" >> $env:GITHUB_ENV
      - name: Build the zip and the setup program (signed when the certificate is there)
        run: python -m tools.build_windows
      - name: Smoke test, setup program (install, run, uninstall)
        timeout-minutes: 20
        run: python -m tools.smoke_package windows-setup "dist/harness-design-studio-$($env:TAG.Substring(1))-windows-x86_64-setup.exe"
      - name: Smoke test, portable zip
        timeout-minutes: 20
        run: python -m tools.smoke_package windows-zip "dist/harness-design-studio-$($env:TAG.Substring(1))-windows-x86_64.zip"
      - name: Check the signature (only when the package was signed)
        if: ${{ env.WINDOWS_CERT_PFX_BASE64 != '' }}
        run: |
          $sig = Get-AuthenticodeSignature "dist/harness-design-studio-$($env:TAG.Substring(1))-windows-x86_64-setup.exe"
          $sig | Format-List
          if ($sig.Status -ne 'Valid') { throw "the setup program's signature is $($sig.Status)" }
      - uses: actions/upload-artifact@v4
        with:
          name: packages-windows
          if-no-files-found: error
          path: |
            HarnessDesignStudio/dist/*-setup.exe
            HarnessDesignStudio/dist/*.zip

  release:
    # The only job that publishes: it takes the packages of the build jobs, writes one SHA256SUMS
    # over all of them and creates or edits the release page. It does not run unless every build
    # and every smoke test succeeded.
    if: ${{ !inputs.notes_only }}
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write  # create the release and attach the files; nothing else in this workflow may
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag matches the version and the changelog
        run: python -m tools.release_notes check "$TAG"
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: HarnessDesignStudio/dist
      - name: The packages of every platform are there
        run: |
          ls -l dist
          # a .deb, a .tar.gz, and the Windows setup program and zip
          test "$(ls dist/*.deb dist/*.tar.gz dist/*-setup.exe dist/*.zip | wc -l)" = 4
      - name: Checksums (one SHA256SUMS over all packages, names without folders)
        run: |
          python -m tools.gen_scf dist
          cd dist && sha256sum -c SHA256SUMS
          cd .. && python -m tools.release_notes complete dist/SHA256SUMS
      - name: Release notes
        run: python -m tools.release_notes notes "$TAG" dist/SHA256SUMS "$RUNNER_TEMP/notes.md"
      - uses: actions/upload-artifact@v4
        with:
          name: harness-design-studio-${{ env.TAG }}
          if-no-files-found: error
          path: |
            HarnessDesignStudio/dist/*.deb
            HarnessDesignStudio/dist/*.tar.gz
            HarnessDesignStudio/dist/*-setup.exe
            HarnessDesignStudio/dist/*.zip
            HarnessDesignStudio/dist/SHA256SUMS
            HarnessDesignStudio/dist/scf.json
      - name: Publish the release page
        run: |
          title="Harness Design Studio ${TAG#v}"
          files=(dist/*.tar.gz dist/*.deb dist/*-setup.exe dist/*.zip dist/SHA256SUMS)
          flags=()
          case "$TAG" in *rc*) flags+=(--prerelease) ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" --verify-tag --title "$title" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}" "${files[@]}"
          fi

  notes:
    # Writes the text of an existing release page again with this version of tools/release_notes.py
    # (the tag's own copy may be older): the tag's changelog and the checksums already published.
    # Packages and tag are not touched.
    if: ${{ inputs.notes_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write  # edit the release page; nothing else
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: tagged
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Release notes from the published checksums
        run: |
          gh release download "$TAG" --pattern SHA256SUMS --dir "$RUNNER_TEMP" --clobber
          python -m tools.release_notes notes "$TAG" "$RUNNER_TEMP/SHA256SUMS" "$RUNNER_TEMP/notes.md" --root "$GITHUB_WORKSPACE/tagged/HarnessDesignStudio"
          gh release edit "$TAG" --title "Harness Design Studio ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md"
