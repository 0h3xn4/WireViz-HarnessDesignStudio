name: harness-design-studio sources

# Runs the source step of the release workflow without a release: it builds the Linux package
# the same way, makes its inventory, and fetches the corresponding source of the LGPL and GPL
# components (tools/fetch_sources.py, decision D-213). It publishes nothing and keeps nothing
# but a short listing. Before this workflow, the step ran only on a release tag, so each fix
# needed a new release candidate (1.17.1rc1 and rc2 stopped there).
on:
  pull_request:
    paths:
      - "HarnessDesignStudio/tools/fetch_sources.py"
      - "HarnessDesignStudio/tools/third_party.py"
      - "HarnessDesignStudio/tools/build_installer.py"
      - ".github/workflows/harness-sources.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-sources-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: HarnessDesignStudio

jobs:
  sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.14"
      - name: Qt system libraries (as the release workflow)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0
      - run: python -m pip install -e ".[gui,dev]"
      - run: python -m tools.build_installer
      - name: Inventory of the package
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python -m tools.third_party inventory dist/harness-design-studio --format linux --version "$version" --out dist/legal
      - name: Source of the LGPL and GPL components (as the release workflow)
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          python -m tools.fetch_sources dist/legal/third-party-inventory-*-linux.json --out dist/sources
          cat dist/sources/SOURCES.txt
          du -sh dist/sources
