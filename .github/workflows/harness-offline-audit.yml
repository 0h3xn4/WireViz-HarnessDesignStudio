name: harness-design-studio offline audit

# The offline audit of the built packages (docs/DECISIONS.md D-203, REQ-OFFLINE-02 to REQ-OFFLINE-06,
# docs/VERIFY_OFFLINE.md). Linux: the .tar.gz and the .deb that this run builds go through a whole
# workflow in a network namespace without network and under strace, with canaries in the project;
# every socket, connection, program started, file written and library loaded is judged against
# tools/offline_audit_allow.json. Windows: the portable .zip, with firewall rules and Windows' audit
# events. Not a required check (yet). It never publishes; the reports are artifacts of the run.
on:
  push:
    branches: [master]
    paths:
      - "HarnessDesignStudio/src/**"
      - "HarnessDesignStudio/packaging/**"
      - "HarnessDesignStudio/tools/**"
      - "HarnessDesignStudio/pyproject.toml"
      - ".github/workflows/harness-offline-audit.yml"
  pull_request:
    paths:
      - "HarnessDesignStudio/src/**"
      - "HarnessDesignStudio/packaging/**"
      - "HarnessDesignStudio/tools/**"
      - "HarnessDesignStudio/pyproject.toml"
      - ".github/workflows/harness-offline-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-offline-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: HarnessDesignStudio

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Qt system libraries, strace, a virtual X display, bubblewrap
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 strace xvfb bubblewrap
      - run: python -m pip install -e ".[gui,dev]"
      - run: python -m tools.build_installer
      - run: python -m tools.build_deb
      - name: Frozen app self-test
        env:
          QT_QPA_PLATFORM: offscreen
        run: dist/harness-design-studio/harness-design-studio-gui --selftest
      - name: Which way to run a program without network works on this runner (information)
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone 2>/dev/null || true
          unshare -rn sh -c 'cat /proc/net/dev' && echo "unshare -rn: works" || echo "unshare -rn: refused"
          bwrap --dev-bind / / --unshare-net -- cat /proc/net/dev && echo "bwrap --unshare-net: works" || echo "bwrap --unshare-net: refused"
          sudo -n unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups -- cat /proc/net/dev && echo "sudo unshare -n: works" || echo "sudo unshare -n: refused"
      - name: Offline audit of the .tar.gz (the editor offscreen)
        run: python -m tools.offline_audit --package dist/harness-design-studio-*-linux-x86_64.tar.gz --out ../offline-audit-tar-gz
      - name: Offline audit of the .deb (the editor on a virtual X display)
        if: ${{ !cancelled() }}
        run: python -m tools.offline_audit --package dist/harness-design-studio_*_amd64.deb --out ../offline-audit-deb --gui-platform xcb
      - name: Summary
        if: ${{ !cancelled() }}
        run: cat ../offline-audit-*/offline-audit.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: offline-audit-linux
          if-no-files-found: warn
          path: offline-audit-*

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -e ".[gui,dev]"
      - name: Build the portable zip (no setup program)
        run: python -m tools.build_windows --no-installer
      - name: Offline audit of the .zip (firewall rules, Windows audit events; the runner is an administrator)
        run: python -m tools.offline_audit --package (Get-ChildItem dist\*-windows-x86_64.zip).FullName --out ..\offline-audit-windows
      - name: Summary
        if: ${{ !cancelled() }}
        run: Get-Content ..\offline-audit-windows\offline-audit.md -ErrorAction SilentlyContinue | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: offline-audit-windows
          if-no-files-found: warn
          path: offline-audit-windows
