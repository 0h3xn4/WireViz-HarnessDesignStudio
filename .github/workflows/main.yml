name: Create Examples

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    strategy:
      max-parallel: 6
      matrix:
        # Python 3.14 and newer only. The runner is named here and not as ubuntu-latest:
        # ubuntu-latest moved to 26.04 in October 2026.
        # More details: https://github.com/actions/runner-images/issues/10636
        os: [ubuntu-24.04]
        python-version: ["3.14"]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Setup Graphviz
      uses: ts-graphviz/setup-graphviz@v2
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .
    - name: Create Examples
      run: PYTHONPATH=$(pwd)/src/wireviz:$PYTHONPATH cd src/wireviz/ && python build_examples.py
    - name: Upload examples, demos, and tutorials
      uses: actions/upload-artifact@v4
      with:
        name: examples-and-tutorials-v${{ matrix.python-version }}
        path: |
          examples/
          tutorial/
        if-no-files-found: error
        
