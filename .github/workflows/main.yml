name: Create Examples

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read  # the job only reads the repository and uploads an artifact (added in D-203 work; the file is inherited from WireViz)

jobs:
  build:
    strategy:
      max-parallel: 6
      matrix:
        # Python 3.14 and newer only. The runner is named here and not as ubuntu-latest:
        # ubuntu-latest moved to 26.04 in October 2026.
        # More details: https://github.com/actions/runner-images/issues/10636
        os: [ubuntu-24.04]
        python-version: ["3.14"]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Setup Graphviz
      uses: ts-graphviz/setup-graphviz@6005aebc0168bb7f1c4b55f1e611648e57fb15d0  # v2.0.3
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .
    - name: Create Examples
      run: PYTHONPATH=$(pwd)/src/wireviz:$PYTHONPATH cd src/wireviz/ && python build_examples.py
    - name: Upload examples, demos, and tutorials
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
      with:
        name: examples-and-tutorials-v${{ matrix.python-version }}
        path: |
          examples/
          tutorial/
        if-no-files-found: error
        
