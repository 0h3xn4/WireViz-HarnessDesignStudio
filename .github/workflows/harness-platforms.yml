name: harness-design-studio platforms

# The test suite on Windows. The Ubuntu run (harness-ci.yml) stays the reference: it also
# enforces the coverage gate and builds the packages.
on:
  push:
    branches: [master, "port/**"]
    paths: ["HarnessDesignStudio/**", ".github/workflows/harness-platforms.yml"]
  pull_request:
    paths: ["HarnessDesignStudio/**", ".github/workflows/harness-platforms.yml"]

permissions:
  contents: read

concurrency:
  group: harness-platforms-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: HarnessDesignStudio

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen
      HARNESS_TIME_FACTOR: "8"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.14"
      - run: python -m pip install -e ".[gui,dev]"
      # a test that hangs becomes a failure with the stack of every thread, not a silent wait
      - run: python -m pip install pytest-timeout
      - name: Tests (in parallel)
        run: python -m pytest -n auto --dist worksteal -m "${{ github.event_name == 'pull_request' && 'not perf and not slow' || 'not perf' }}" -q -rfE --tb=short -p no:cacheprovider --no-cov --timeout=300 --timeout-method=thread
      - name: Tests with a wall-clock limit (alone)
        run: python -m pytest -m perf -q -rfE --tb=short -p no:cacheprovider --no-cov --timeout=600 --timeout-method=thread
