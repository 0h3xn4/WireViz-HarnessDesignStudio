name: harness-design-studio packages (Windows)

# Builds the Windows packages and tests the finished files the way a user would use them
# (docs/RELEASE.md, "Windows packages"). It never publishes: the packages are workflow
# artifacts only. The release itself is made by release.yml, which builds the same way.
on:
  push:
    branches: ["pkg/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-packages-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: HarnessDesignStudio

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.14"
      - run: python -m pip install -e ".[gui,dev]"
      - name: Inno Setup (preinstalled on the runner image; installed when it is not)
        run: |
          $found = (Get-Command ISCC -ErrorAction SilentlyContinue) -or (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") -or (Test-Path "${env:LOCALAPPDATA}\Programs\Inno Setup 6\ISCC.exe")
          if (-not $found) { choco install innosetup --version=6.4.3 -y --no-progress }
          else { Write-Host "Inno Setup is already installed" }
      - name: Where the settings file goes
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "from PySide6.QtWidgets import QApplication; a = QApplication([]); from harness_design_studio.gui.app import make_settings; print(make_settings().fileName())"
      - name: Which bundled fonts Qt can load (information)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "from PySide6.QtWidgets import QApplication; a = QApplication([]); from PySide6 import __version__ as v; from PySide6.QtGui import QFontDatabase as D; from harness_design_studio.resources import fonts_path; print('PySide6', v); [print(f.name, D.addApplicationFont(str(f)), D.applicationFontFamilies(0)) for f in sorted(fonts_path().glob('*.ttf'))]"
      - run: python -m PyInstaller --version
      - name: Build the zip and the setup program
        run: python -m tools.build_windows
      - run: Get-ChildItem dist | Format-Table Name, Length
      - name: Smoke test, setup program (install, run, uninstall)
        timeout-minutes: 20
        run: python -m tools.smoke_package windows-setup "dist/harness-design-studio-$(python -c 'from harness_design_studio import __version__ as v; print(v)')-windows-x86_64-setup.exe"
      - name: Smoke test, portable zip
        timeout-minutes: 20
        run: python -m tools.smoke_package windows-zip "dist/harness-design-studio-$(python -c 'from harness_design_studio import __version__ as v; print(v)')-windows-x86_64.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: harness-design-studio-windows-x86_64
          if-no-files-found: error
          path: |
            HarnessDesignStudio/dist/*-setup.exe
            HarnessDesignStudio/dist/*.zip
