# Check a harness design on every push. Copy this file to .github/workflows/ in your design repository.
# The tool is offline: install the .deb that you got from your tool administrator. Here it is
# assumed to be stored in the repository under tools/.
name: harness-design

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the tool
        run: sudo apt-get install -y ./tools/harness-design-studio_*_amd64.deb
      - name: Validate, generate, check and export
        run: |
          harness check design
          harness generate design
          harness verify design
          harness drc design > drc-report.md   # fails the build when an error is not waived
          harness export design
          harness verify design --outputs
      - name: Keep the design rule report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-drc-report
          path: drc-report.md
          if-no-files-found: ignore
      - name: Keep the outputs
        uses: actions/upload-artifact@v4
        with:
          name: harness-outputs
          path: design/outputs
